# operator-decisions.yaml
# Registre canonique des décisions bloquantes réservées à l'opérateur.
# Statut: EN CONSTRUCTION -> mis à jour au fil des tickets.
# Toute entrée "status: open" bloque les tickets listés dans "blocks"
# jusqu'à ce qu'un opérateur humain renseigne "decision" et "decided_at".
# Ce fichier est la source de vérité unique pour ces décisions — ne pas
# dupliquer leur contenu de façon divergente dans un document markdown.

