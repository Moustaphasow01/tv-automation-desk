  - id: OP-12
    title: "État du hold ENGINE_V5_VALIDATION_HOLD à la date de démarrage effective"
    description: >
      L'état constaté le 2026-08-07 (hold actif depuis 2026-08-01) est
      daté — à revérifier explicitement avant toute planification
      d'activation, la date de démarrage réel de l'implémentation pouvant
      différer de la date de cet audit.
    status: open
    code_inspection_finding: >
      Mécanisme localisé par LECTURE STATIQUE du code (pas d'exécution) :
      le hold est porté par des documents desk_claim_lane_controls (champs
      enabled/status/reason) en base, pour les lanes "live" et "replay",
      avec reason="ENGINE_V5_VALIDATION_HOLD" (mcp_gpt_desk/src/v5-frozen-quiesce.js:3,
      mcp_gpt_desk/scripts/verify_v5_frozen_state.mjs:44-58). Ce n'est PAS
      un flag statique dans un fichier de config — l'état vit en base de
      données, il change dans le temps indépendamment du code.
    environment_note: >
      Confirmé par l'opérateur (2026-08-07) : le checkout preprod local et
      le VPS de production tournent le même code — la préprod est le
      stade de développement/test qui est ensuite déployé tel quel sur le
      VPS. Le mécanisme ci-dessus est donc valide dans les deux
      environnements. Ce qui reste distinct entre les deux, c'est l'ÉTAT
      RUNTIME (le contenu réel de desk_claim_lane_controls à un instant
      donné), qui peut différer d'un environnement à l'autre.
    why_not_resolved_by_the_planning_agent: >
      Hors de portée du rôle de planification (cette session ne fait que
      documenter et préparer le terrain — elle n'exécute aucun code, ce
      qui relève exclusivement de l'agent d'implémentation Codex). La
      vérification de cet état runtime fait déjà partie intégrante du
      contenu du Ticket -1.1 lui-même ("état réel des 9 services", 17-EXECUTABLE-BACKLOG.md)
      — c'est Codex qui l'exécutera concrètement au moment de démarrer
      l'implémentation, pas cette session de planification.
    default_if_unresolved: "ne jamais supposer le hold levé sans vérification"
    blocks: []
    note: >
      Retiré de la liste bloquante avant Ticket -1.1 : la vérification de
      OP-12 est désormais traitée comme faisant partie de l'exécution du
      Ticket -1.1 lui-même (capturée par Codex au moment T, avec
      `node mcp_gpt_desk/scripts/verify_v5_frozen_state.mjs --freeze-only`
      ou équivalent), plutôt que comme un pré-requis à trancher avant que
      Codex ne commence.
    referenced_in:
      - "02-VERIFIED-AS-IS-SUMMARY.md#8"

