name: Local preproduction CI

on:
  pull_request:
  push:

jobs:
  windows-deployment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Windows deployment and drain contracts
        run: node scripts/quality/check_windows_deployment_kit.mjs

  grains-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desk -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp_gpt_desk/package-lock.json
      - run: npm --prefix mcp_gpt_desk ci
      - name: Real PostgreSQL grains, administrative history and producer fences
        run: npm run test:grains:postgres

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:uiux-rules
      - run: npm run audit:uiux:report
      - run: npm run audit:front-vocabulary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-ux-static-audit
          path: reports/ui-ux/front-v2-static-audit.json
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:react
      - run: npm --prefix packages/desk-contracts run check:generated
      - run: npm run guard:strategy-contracts
      - run: npm run guard:windows-deployment
      - run: node scripts/quality/check_contracts_finalization.mjs
      - run: npm --prefix packages/desk-domain run coverage:gate
      - run: npm --prefix packages/desk-replay-engine test
      - run: npm --prefix packages/desk-audit test
      - run: npm --prefix packages/desk-time test
      - run: npm --prefix mcp_gpt_desk ci
      - run: npm --prefix mcp_gpt_desk run audit:backend-cleanup
      - run: npm --prefix mcp_gpt_desk test
      - run: docker compose config --quiet
